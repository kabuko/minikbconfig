[package]
name = "minikbconfig"
description = "Command-line configurator for SDCX SIDE-KEYBOARD macro pads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "minikbconfig"
path = "src/main.rs"

[dependencies]
minikbconfig-config.workspace = true
minikbconfig-core.workspace = true
minikbconfig-hid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
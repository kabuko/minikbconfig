[workspace]
resolver = "2"
members = [
    "crates/minikbconfig-config",
    "crates/minikbconfig-core",
    "crates/minikbconfig-hid",
    "crates/minikbconfig",
    "crates/minikbconfig-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/yourname/minikbconfig"

[workspace.dependencies]
minikbconfig-config = { path = "crates/minikbconfig-config", version = "0.1.0" }
minikbconfig-core = { path = "crates/minikbconfig-core", version = "0.1.0" }
minikbconfig-hid = { path = "crates/minikbconfig-hid", version = "0.1.0" }
anyhow = "1"
thiserror = "2"